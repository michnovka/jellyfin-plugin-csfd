name: Release

# Push a tag like v0.2.0.0 to build THAT commit, publish the GitHub release,
# and then update manifest.json on main (the URL Jellyfin servers poll).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Default checkout of a tag push is the tagged commit — build exactly that.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Validate tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vN.N.N.N"; exit 1; }
      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          dotnet build src/Jellyfin.Plugin.Csfd -c Release "-p:AssemblyVersion=${VERSION}" "-p:FileVersion=${VERSION}"
          # Merge the new version entry into the CURRENT main manifest, not the
          # tag-era snapshot — otherwise rerunning an old tag would erase newer
          # version entries.
          git fetch origin main
          git show FETCH_HEAD:manifest.json > manifest.json || true
          python3 scripts/package.py "$VERSION" "${NOTES:-Release ${VERSION}}"
      # Release (with the zip) is created BEFORE the manifest advertises it, so
      # a failed release never leaves clients pointing at a 404.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release exists, re-uploading zip"
            gh release upload "v${VERSION}" "dist/csfd-rating_${VERSION}.zip" --clobber
          else
            gh release create "v${VERSION}" "dist/csfd-rating_${VERSION}.zip" \
              --title "v${VERSION}" --notes "${NOTES:-Release ${VERSION}}"
          fi
      - name: Commit manifest to main
        run: |
          cp manifest.json /tmp/manifest.json
          # Tag checkouts have no local main; create it from the fetched ref.
          git fetch origin main
          git switch -C main FETCH_HEAD
          cp /tmp/manifest.json manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Release ${GITHUB_REF_NAME#v}"
          git push origin main
      - name: Attach manifest to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" manifest.json --clobber
